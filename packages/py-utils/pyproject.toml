[tool.coverage.run]
branch = true
source = [ "py_utils" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/packages/py-utils/html'
 --cov-report xml:'../../coverage/packages/py-utils/coverage.xml'
 --html='../../reports/packages/py-utils/unittests/html/index.html'
 --junitxml='../../reports/packages/py-utils/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "py_utils" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "py-utils"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [ ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
