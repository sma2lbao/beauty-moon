[project]
name = "ink"
version = "0.1.0"
description = "个人知识库（RAG 问答）应用：LlamaIndex + DeepSeek + bge-m3 + ChromaDB"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    # LlamaIndex 模块化安装（0.12+ 拆分包方式）
    "llama-index-core>=0.12",
    "llama-index-llms-deepseek>=0.4.1",
    "llama-index-embeddings-huggingface>=0.8",
    "llama-index-vector-stores-chroma>=0.6",
    # 配置管理：读取 .env
    "pydantic-settings>=2.6",
    # 文档解析（M2 摄取管道）
    "pymupdf>=1.24",      # PDF 解析
    "python-docx>=1.1",   # docx 解析
    # 混合检索与重排（M3）
    "llama-index-retrievers-bm25>=0.5",  # BM25 稀疏检索
    "FlagEmbedding>=1.3",                # bge-reranker-v2-m3 加载
    # 聊天 UI（M4）
    "streamlit>=1.40",
]

[project.scripts]
# CLI 入口：uv run ink <命令>
ink = "ink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ink"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # isort
    "I",
]
ignore = []
fixable = ["ALL"]
