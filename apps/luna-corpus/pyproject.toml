[tool.coverage.run]
branch = true
source = [ "luna_corpus" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/luna-corpus/html'
 --cov-report xml:'../../coverage/apps/luna-corpus/coverage.xml'
 --html='../../reports/apps/luna-corpus/unittests/html/index.html'
 --junitxml='../../reports/apps/luna-corpus/unittests/junit.xml'
"""

[project]
name = "luna-corpus"
version = "1.0.0"
description = "RAG-based Q&A knowledge base system"
requires-python = ">=3.11,<4"
readme = 'README.md'
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # LangChain
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    # Vector store
    "chromadb>=0.5.0",
    # Ollama
    "langchain-ollama>=0.1.0",
    # Ark (OpenAI-compatible)
    "langchain-openai>=0.2.0",
    # MySQL
    "mysql-connector-python>=8.0.0",
    "sqlalchemy>=2.0.0",
    # Alembic
    "alembic>=1.13.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # Ingestion parsers
    "pypdf>=4.0",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.32",
    # Observability
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # Hybrid retrieval (BM25 keyword search)
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
rerank = [
    # Local cross-encoder reranking (bge-reranker); pulls in torch.
    "sentence-transformers>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["luna_corpus"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
